name: Frontend CI

on:
  pull_request:
  push:
    branches: [feature/init, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, build and test (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-blocking until the 98 pre-existing lint errors are fixed (approved exception, AGF-S1-03 report).
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Type-check and build
        run: npm run build

      - name: Unit tests
        run: npm test

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so every commit on the branch is scanned

      - name: Install gitleaks (pinned version, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      # Fails on any finding not listed in .gitleaksignore. Output is redacted; values are never printed.
      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose --exit-code 1'
