name: Frontend CI

on:
  pull_request:
  push:
    branches: [feature/init, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, build and test (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-blocking until the 98 pre-existing lint errors are fixed (approved exception, AGF-S1-03 report).
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Type-check and build
        run: npm run build

      - name: Unit tests
        run: npm test

  # AGF-S2-28: owner → guest smoke journeys in a real browser against the real backend (demo profile, in-memory data).
  # The backend branch is the same-named one if it exists, else develop (pull requests: the base branch's name).
  e2e-smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Choose the backend branch
        id: backend
        run: |
          ref="$(node e2e/support/runEnv.mjs backend-ref)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Backend branch: $ref"

      - name: Check out the backend
        uses: actions/checkout@v4
        with:
          repository: amuni27/jemaw-menu-backend-spring
          ref: ${{ steps.backend.outputs.ref }}
          path: backend

      - name: Backend commit under test
        run: git -C backend log -1 --format='%H %s'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Secrets (owner password, JWT and reset secrets) are generated per run inside playwright.config.ts.
      - name: Run smoke journeys
        env:
          E2E_BACKEND_DIR: backend
        run: npm run e2e

      - name: Upload report and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so every commit on the branch is scanned

      - name: Install gitleaks (pinned version, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      # Fails on any finding not listed in .gitleaksignore. Output is redacted; values are never printed.
      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose --exit-code 1'
